<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONSULTA SERVIDOR PVD - SEMSA</title>
    
    <!-- Biblioteca SheetJS para processar Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- Biblioteca Html2Pdf para gerar o ficheiro PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: linear-gradient(to right, #072e50, #034b75); 
            color: #14171a; 
            margin: 0; 
            padding: 20px 20px 100px 20px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Cabeçalho Profissional */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin: 0 auto 30px auto;
            padding: 20px 35px;
            background: rgba(255, 255, 255, 0.06); 
            border-radius: 16px;
            max-width: 1100px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .app-logo {
            width: 280px; 
            height: auto;
            max-height: 90px;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3)); 
        }
        .app-title-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-left: 2px solid rgba(255, 255, 255, 0.2); 
            padding-left: 25px;
        }
        .app-title-group h1 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 800;
            margin: 0 0 6px 0;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            text-transform: uppercase;
        }
        .app-title-group h2 {
            color: #a5d0f5; 
            font-size: 15px;
            font-weight: 600;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Container Principal */
        .container { 
            max-width: 1100px; 
            margin: 0 auto; 
            background: #f0f8ff; 
            border-radius: 16px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            overflow: hidden; 
            flex-grow: 1; 
            width: 100%;
        }

        /* Tooltips Flutuantes */
        .floating-tooltip {
            background: #0284c7;
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            position: absolute;
            z-index: 50;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
            line-height: 1.4;
            left: 0;
            top: 100%;
            width: 250px;
            text-align: left;
            animation: float1 1.5s infinite;
        }
        .floating-tooltip.active { opacity: 1; visibility: visible; }
        .floating-tooltip::after {
            content: ''; position: absolute; border-style: solid;
            bottom: 100%; left: 20px; border-width: 0 8px 8px 8px; border-color: transparent transparent #0284c7 transparent;
        }
        #tooltip3 {
            top: auto; bottom: 100%; left: 50%; margin-left: -125px; animation: float3 1.5s infinite;
        }
        #tooltip3::after {
            bottom: auto; top: 100%; left: 50%; margin-left: -8px; border-width: 8px 8px 0 8px; border-color: #0284c7 transparent transparent transparent;
        }
        @keyframes float1 { 0%, 100% { margin-top: 12px; } 50% { margin-top: 6px; } }
        @keyframes float3 { 0%, 100% { margin-bottom: 12px; } 50% { margin-bottom: 6px; } }
        
        .controls-wrapper { display: flex; flex-wrap: wrap; border-bottom: 1px solid #cbd5e1; }
        .control-section { flex: 1; min-width: 320px; padding: 25px; border-right: 1px solid #cbd5e1; box-sizing: border-box; }
        .control-section:last-child { border-right: none; }
        
        h3 { font-size: 16px; font-weight: bold; margin-top: 0; color: #14171a; }
        
        /* Estilo da Entrada de Texto */
        input[type="text"] { 
            flex: 1; padding: 12px 18px; border: 1px solid #94a3b8; border-radius: 9999px; 
            font-size: 16px; font-weight: 700; color: #034b75; outline: none; transition: 0.2s; 
            background-color: #ffffff; box-sizing: border-box;
        }
        input[type="text"]:focus { border-color: #1da1f2; }
        input[type="text"]::placeholder { font-size: 14px; font-weight: 400; color: #94a3b8; }
        
        input[type="file"] { font-size: 14px; color: #657786; width: 100%; margin-bottom: 5px; }
        input[type="file"]::file-selector-button {
            padding: 8px 16px; border-radius: 9999px; border: 1px solid #1da1f2;
            background-color: #ffffff; color: #1da1f2; font-weight: bold; cursor: pointer;
            transition: 0.2s; margin-right: 10px;
        }
        input[type="file"]::file-selector-button:hover { background-color: #e8f5fd; }
        
        /* Botões */
        .btn { padding: 10px 24px; background-color: #1da1f2; color: white; border: none; border-radius: 9999px; cursor: pointer; font-size: 15px; font-weight: bold; transition: 0.2s; }
        .btn:hover:not(:disabled) { background-color: #1a91da; }
        .btn:disabled { background-color: #a5d0f5; cursor: not-allowed; opacity: 0.7; }
        .btn-success { background-color: #10b981; margin-top: 15px; font-size: 16px; }
        .btn-success:hover:not(:disabled) { background-color: #059669; }
        
        .search-group { display: flex; gap: 10px; margin-top: 15px; }
        .status { font-size: 13px; margin-top: 10px; font-weight: 500; }
        .text-green { color: #17bf63; }
        .text-red { color: #e0245e; }
        .text-gray { color: #657786; }
        
        /* Múltiplos Resultados */
        #selectionArea { display: none; padding: 25px; border-bottom: 1px solid #cbd5e1; background-color: #f8fafc; }
        .server-option { padding: 10px 15px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 8px; background: white; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .server-option:hover { border-color: #1da1f2; background-color: #f0f8ff; }
        .server-name { font-weight: bold; color: #034b75; }
        .server-doc { font-size: 12px; color: #64748b; }

        /* =========================================
           ESTILOS DO RELATÓRIO PDF (Azul Petróleo - Full Bleed)
           ========================================= */
        .results-section { padding: 0; min-height: 200px; }
        #loading { display: none; margin-top: 10px; color: #1da1f2; font-size: 14px; font-weight: 500; }
        
        #printArea {
            background: linear-gradient(to right, #072e50, #034b75);
            color: #ffffff;
            padding: 40px; 
            margin: 0;
            width: 100%;
            min-height: 100%; /* Ajuda no Full Bleed */
            box-sizing: border-box;
        }

        /* Envolve a área do print no ecrã web para manter a estética do site sem afetar o PDF */
        .print-container-web {
            padding: 25px;
        }
        .print-container-web #printArea {
            border-radius: 8px; /* Cantos arredondados só na web */
        }

        /* Cabeçalho Oficial do PDF (Novo Título) */
        .pdf-header {
            display: flex; align-items: center; justify-content: center; gap: 25px;
            margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        .pdf-header img { max-height: 70px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
        .pdf-header-text { text-align: left; line-height: 1.4; }
        .pdf-header-text h3 { margin: 0; color: #ffffff; font-size: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .pdf-header-text p { margin: 5px 0 0 0; color: #a5d0f5; font-size: 13px; }

        #printArea .info-card {
            display: flex; flex-wrap: wrap; gap: 30px; background: rgba(255, 255, 255, 0.05); 
            padding: 18px 25px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 25px;
        }
        .info-item { display: flex; flex-direction: column; }
        .info-label { font-size: 11px; color: #a5d0f5; text-transform: uppercase; font-weight: bold; margin-bottom: 4px; }
        .info-value { font-size: 15px; color: #ffffff; font-weight: 600; }
        .text-danger { color: #fca5a5 !important; }

        #printArea table { width: 100%; border-collapse: collapse; font-size: 11px; }
        #printArea th { text-align: left; padding: 12px 10px; border-bottom: 2px solid #a5d0f5; color: #a5d0f5; font-size: 11px; text-transform: uppercase; }
        #printArea td { padding: 12px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); color: #ffffff; white-space: normal; word-wrap: break-word; }
        #printArea tr:hover { background-color: rgba(255, 255, 255, 0.05); } 

        /* Rodapé Ajustado */
        .footer {
            margin-top: 40px; display: flex; justify-content: space-between; align-items: center;
            color: #ffffff; font-size: 12px; width: 100%; max-width: 1100px; margin-left: auto; margin-right: auto;
        }
        .footer-logo { max-height: 50px; width: auto; }
        /* Logo central da DID ligeiramente maior, sem texto debaixo */
        .footer-center { text-align: center; display: flex; flex-direction: column; align-items: center; }
        .footer-center img { max-height: 60px; } 
        .footer-right { text-align: right; line-height: 1.6; }
        .footer-right img { max-height: 40px; margin-bottom: 10px; }

        @media (max-width: 768px) {
            body { padding: 10px 10px 40px 10px; }
            .app-header { flex-direction: column; text-align: center; gap: 15px; padding: 20px 15px; }
            .app-logo { max-width: 200px; }
            .app-title-group { border-left: none; border-top: 1px solid rgba(255, 255, 255, 0.2); padding-left: 0; padding-top: 15px; }
            .app-title-group h1 { font-size: 22px; }
            .app-title-group h2 { font-size: 12px; }
            .controls-wrapper { flex-direction: column; }
            .control-section { border-right: none; border-bottom: 1px solid #cbd5e1; min-width: 100%; }
            .control-section:last-child { border-bottom: none; }
            .search-group { flex-direction: column; align-items: stretch; }
            .search-group input[type="text"] { width: 100%; }
            .search-group .btn { width: 100%; }
            .info-card { flex-direction: column; gap: 15px; }
            .footer { flex-direction: column; gap: 30px; }
            .footer-left, .footer-center, .footer-right { text-align: center; }
            .pdf-header { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
    
    <div class="app-header">
        <img src="logo_did.png" alt="Diretoria de Inteligência de Dados" class="app-logo">
        <div class="app-title-group">
            <h1>CONSULTA SERVIDOR PVD</h1>
            <h2>Secretaria Municipal de Saúde - SEMSA</h2>
        </div>
    </div>
    
    <div class="container">
        
        <div class="controls-wrapper">
            <div class="control-section">
                <h3>1. Carregar Base Consolidada (.xlsx)</h3>
                <div style="position: relative;">
                    <input type="file" id="fileInput" accept=".xlsx, .xls" />
                    <div id="tooltip1" class="floating-tooltip active">
                        <strong>💡
